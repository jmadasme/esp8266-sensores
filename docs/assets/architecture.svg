<path d="M396 370 V125 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="125" r="3" fill="#2A9D8F"/><rect x="428" y="104" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="122" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">AirSensor-8266</text><text x="444" y="137" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Calidad de aire con MQ135 y publicación MQTT a smartage.cl:1886.</text><text x="1104" y="129" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">01</text><path d="M396 370 V174 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="174" r="3" fill="#2A9D8F"/><rect x="428" y="153" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="171" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">DHT22</text><text x="444" y="186" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Temperatura y humedad con PlatformIO; el README está en docs/.</text><text x="1104" y="178" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">02</text><path d="M396 370 V223 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="223" r="3" fill="#2A9D8F"/><rect x="428" y="202" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="220" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">DoorSensor-8266</text><text x="444" y="235" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Sensor de puerta MC-38 con lectura cada 500 ms y MQTT.</text><text x="1104" y="227" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">03</text><path d="M396 370 V272 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="272" r="3" fill="#2A9D8F"/><rect x="428" y="251" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="269" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">LCD1602_I2C</text><text x="444" y="284" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Controlador PCF8574 + HD44780 para LCD 16x2 por I2C.</text><text x="1104" y="276" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">04</text><path d="M396 370 V321 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="321" r="3" fill="#2A9D8F"/><rect x="428" y="300" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="318" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">Ldr-8266</text><text x="444" y="333" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Lectura analógica de luz con clasificación oscuro/claro.</text><text x="1104" y="325" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">05</text><path d="M396 370 V370 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="370" r="3" fill="#2A9D8F"/><rect x="428" y="349" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="367" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">ReedSwitchTester</text><text x="444" y="382" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Sketch de 946 bytes para probar un MC-38 en tres modos.</text><text x="1104" y="374" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">06</text><path d="M396 370 V419 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="419" r="3" fill="#2A9D8F"/><rect x="428" y="398" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="416" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">SensorPIR-8266</text><text x="444" y="431" fill="#9db4bd" font-family="sans-serif" font-size="9.5">PIR HC-SR501 con watchdog, ping, reconexión y MAC aleatoria.</text><text x="1104" y="423" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">07</text><path d="M396 370 V468 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="468" r="3" fill="#2A9D8F"/><rect x="428" y="447" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="465" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">TempSensor-8266</text><text x="444" y="480" fill="#9db4bd" font-family="sans-serif" font-size="9.5">DS18B20 con publicación MQTT cada 60 segundos.</text><text x="1104" y="472" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">08</text><path d="M396 370 V517 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="517" r="3" fill="#2A9D8F"/><rect x="428" y="496" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="514" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">random-serial</text><text x="444" y="529" fill="#9db4bd" font-family="sans-serif" font-size="9.5">ESP32-CAM que emite un número aleatorio entre 1 y 100 cada 2 segundos.</text><text x="1104" y="521" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">09</text><path d="M396 370 V566 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="566" r="3" fill="#2A9D8F"/><rect x="428" y="545" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="563" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">sensorudp</text><text x="444" y="578" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Servidor UDP en Python para recibir datos de sensores.</text><text x="1104" y="570" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">10</text><path d="M396 370 V615 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="615" r="3" fill="#2A9D8F"/><rect x="428" y="594" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="612" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">port_scanner</text><text x="444" y="627" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Escáner TCP multihilo en Python con banner, servicios y salida.</text><text x="1104" y="619" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">11</text>
<text x="58" y="735" fill="#9db4bd" font-family="monospace" font-size="10">Cada nodo es una carpeta real en versions/. No se borraron etapas: se pusieron en contexto.</text>
